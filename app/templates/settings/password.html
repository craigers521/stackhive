{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block page_title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-start">
  <div class="col-lg-5">
    <div class="card bg-white">
      <div class="card-header py-2 fw-semibold"><i class="bi bi-shield-lock me-2"></i>{{ current_user.username }}</div>
      <div class="card-body">
        <form method="post" action="{{ url_for('settings.change_own_password') }}">
          <div class="mb-2">
            <label class="form-label small" for="cur-pw">Current password</label>
            <input type="password" class="form-control form-control-sm" id="cur-pw" name="current_password" required autocomplete="current-password">
          </div>
          <div class="mb-2">
            <label class="form-label small" for="new-pw">New password (min 8 chars)</label>
            <input type="password" class="form-control form-control-sm" id="new-pw" name="new_password" required minlength="8" autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label small" for="confirm-pw">Confirm new password</label>
            <input type="password" class="form-control form-control-sm" id="confirm-pw" name="confirm_password" required minlength="8" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-check-lg me-1"></i>Update password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
