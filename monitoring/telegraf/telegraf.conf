[global]
  interval = "10s"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "stackhive"
  bucket = "stackhive-telemetry"

[[inputs.grpc_listener_v2]]
  services = ['/telemetry_grpc.GrpcTelemetry/gNMICapability']
  services = ['/telemetry_grpc.GrpcTelemetry/gNMIStreamTelemetry']
  services = ['/telemetry_grpc.GrpcTelemetry/gNMIPoll']
  use_tls = false
  max_workers = 10

  [[inputs.grpc_listener_v2.descriptors]]
    file = '/etc/telegraf/protos/cisco_ios_xe/*.proto'

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  container_name_include = ["stackhive-*"]
  perdevice = true
  total = false
  # Plan telemetry sizing: suppress per-container redundant fields
  suppress_redundancy = true

[[inputs.cpu]]
  # Plan telemetry sizing: 10s counters / 30s CPU-memory intervals
  interval = "30s"
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]
  interval = "30s"

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devshm", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]
  interval = "10s"

[[inputs.system]]
  fields_exclude = ["load1"]

[[inputs.net]]
