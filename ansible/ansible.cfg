[defaults]
roles_path = ./roles
# NetBox dynamic inventory plugin (netbox_community.netbox_ansible) is resolved
# from these collection paths; CI installs into ~/.ansible/collections,
# local/manual installs may vendor into ./collections.
collections_paths = ./collections:~/.ansible/collections:/usr/share/ansible/collections
inventory = ./inventory
host_key_checking = False
retry_files_enabled = False
timeout = 15
gathering = explicit
interpret = False
deprecation_warnings = False
display_skipped_hosts = False
stdout_callback = default
# Fail fast on undefined variables instead of silently rendering blanks
# (preview and live runs must never ship an empty config).
strict_variables = True

[ssh_connection]
pipelining = True
