name: stackhive-netbox

services:
  netbox-postgres:
    image: postgres:16-alpine
    container_name: stackhive-netbox-postgres
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: ${NETBOX_POSTGRES_PASSWORD:-netbox}
    volumes:
      - netbox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox -d netbox"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  netbox-redis:
    image: redis:7-alpine
    container_name: stackhive-netbox-redis
    volumes:
      - netbox-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  netbox:
    image: netboxcommunity/netbox:v4.0.12
    container_name: stackhive-netbox
    environment:
      SUPERUSER_NAME: ${NETBOX_SUPERUSER_NAME:-admin}
      SUPERUSER_EMAIL: ${NETBOX_SUPERUSER_EMAIL:-admin@stackhive.local}
      SUPERUSER_PASSWORD: ${NETBOX_SUPERUSER_PASSWORD:-ChangeMe123!}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: ${NETBOX_POSTGRES_PASSWORD:-netbox}
      DB_HOST: netbox-postgres
      DB_PORT: 5432
      REDIS_HOST: netbox-redis
      REDIS_PORT: 6379
      SECRET_KEY: ${NETBOX_SECRET_KEY:-}
    volumes:
      - netbox-media:/opt/netbox/netbox/media
      - netbox-scripts:/opt/netbox/netbox/scripts
    depends_on:
      netbox-postgres:
        condition: service_healthy
      netbox-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status/')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netbox.rule=PathPrefix(`/netbox`)"
      - "traefik.http.routers.netbox.priority=10"
      - "traefik.http.middlewares.netbox-strip.stripprefix.prefixes=/netbox"
      - "traefik.http.routers.netbox.middlewares=netbox-strip"
      - "traefik.http.routers.netbox.entrypoints=web"
      - "traefik.http.services.netbox.loadbalancer.server.port=8000"
    restart: unless-stopped

  netbox-worker:
    image: netboxcommunity/netbox:v4.0.12
    container_name: stackhive-netbox-worker
    command: netbox-worker
    environment:
      SUPERUSER_NAME: ${NETBOX_SUPERUSER_NAME:-admin}
      SUPERUSER_EMAIL: ${NETBOX_SUPERUSER_EMAIL:-admin@stackhive.local}
      SUPERUSER_PASSWORD: ${NETBOX_SUPERUSER_PASSWORD:-ChangeMe123!}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: ${NETBOX_POSTGRES_PASSWORD:-netbox}
      DB_HOST: netbox-postgres
      DB_PORT: 5432
      REDIS_HOST: netbox-redis
      REDIS_PORT: 6379
      SECRET_KEY: ${NETBOX_SECRET_KEY:-}
    depends_on:
      netbox-postgres:
        condition: service_healthy
      netbox-redis:
        condition: service_healthy
      netbox:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

volumes:
  netbox-postgres-data:
  netbox-redis-data:
  netbox-media:
  netbox-scripts:
